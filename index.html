<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dear Nadiya Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- LOGIN -->
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <img src="mascot.png" alt="Dear Nadiya" class="login-mascot">
      <p class="eyebrow">DEAR NADIYA</p>
      <h1>Admin Panel ♥</h1>
      <p class="muted">Masuk untuk mengelola Group Order.</p>

      <form id="loginForm">
        <label>
          Username
          <input id="username" type="text" autocomplete="username" value="admin" required>
        </label>

        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" value="180322" required>
        </label>

        <button class="primary-btn" type="submit">Masuk Admin</button>
        <div id="loginMessage" class="message hidden"></div>
      </form>
    </div>
  </section>

  <!-- APP -->
  <section id="app" class="app hidden">

    <aside class="sidebar">
      <div class="brand">
        <img src="mascot.png" alt="Dear Nadiya">
        <div>
          <strong>Dear Nadiya</strong>
          <small>ADMIN PANEL</small>
        </div>
      </div>

      <nav>
        <button data-page="dashboard" class="nav-btn active">🏠 Dashboard</button>
        <button data-page="products" class="nav-btn">📦 Produk & GO</button>
        <button data-page="orders" class="nav-btn">📝 Pesanan</button>
        <button data-page="payments" class="nav-btn">💳 Pembayaran</button>
        <button data-page="recap" class="nav-btn">📈 Rekap GO</button>
      </nav>

      <div class="sidebar-bottom">
        <a href="https://dearnadiya.github.io/Dear-nadiya-website/" target="_blank">← Website Customer</a>
        <button id="logoutBtn" class="logout-btn">Keluar</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">DEAR NADIYA ADMIN</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <button id="refreshBtn" class="secondary-btn">↻ Refresh</button>
      </header>

      <div id="pageContent"></div>
    </main>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
